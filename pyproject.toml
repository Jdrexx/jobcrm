[project]
name = "job-application-crm"
version = "0.2.0"
description = "Kanban-style job application tracker with outreach layer: contacts, channels, follow-up cadence, and reply-rate stats."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9"]
[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]
[tool.pytest.ini_options]
pythonpath = ["."]
